name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (1.2.3 or 1.2.3-rc.1); leave empty for alpha
        type: string
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet Windows code
        env:
          GOOS: windows
        run: |
          for arch in amd64 386 arm64; do
            GOARCH=$arch go vet ./...
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, goarch: amd64 }
          # 32-bit builds run natively on 64-bit Windows.
          - { runner: windows-latest, goarch: '386' }
          - { runner: windows-11-arm, goarch: arm64 }
    name: test (${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
        env:
          GOARCH: ${{ matrix.goarch }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set build version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo '::error::Release builds must run from main'
              exit 1
            fi
            number='(0|[1-9][0-9]*)'
            identifier='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
            if ! [[ "$INPUT_VERSION" =~ ^$number\.$number\.$number(-$identifier(\.$identifier)*)?$ ]]; then
              echo '::error::Expected a version such as 1.2.3 or 1.2.3-rc.1'
              exit 1
            fi
            if [ "$INPUT_VERSION" = "$(jq -r .version mygo.json)" ]; then
              echo '::error::Choose a new release version'
              exit 1
            fi
            existing_tag=$(git ls-remote --tags origin "refs/tags/v$INPUT_VERSION")
            if [ -n "$existing_tag" ]; then
              echo '::error::This version already has a tag'
              exit 1
            fi
            version=$INPUT_VERSION
          else
            version="alpha-${GITHUB_SHA:0:7}"
          fi
          jq --arg version "$version" '.version = $version' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json
          git add mygo.json
          git write-tree > "$RUNNER_TEMP/source-tree"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build portable executables and update files
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ] && [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo '::error::MYGO_UPDATER_PRIVATE_KEY is required for a release build'
            exit 1
          fi
          go tool mygo build -platform windows/amd64,windows/386,windows/arm64 -skip-installer
          git diff --exit-code
          cp "$RUNNER_TEMP/source-tree" build/source-tree
      # One download per architecture, holding just pitstop.exe.
      - uses: actions/upload-artifact@v7
        with:
          name: pitstop-x64-${{ steps.version.outputs.version }}
          path: build/windows-amd64/pitstop.exe
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: pitstop-x86-${{ steps.version.outputs.version }}
          path: build/windows-386/pitstop.exe
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: pitstop-arm64-${{ steps.version.outputs.version }}
          path: build/windows-arm64/pitstop.exe
          if-no-files-found: error
          overwrite: true
      - name: Package release files
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        # Self-update replaces pitstop.exe by name, so each architecture's
        # zip holds it under that name.
        run: |
          mkdir build/dist
          zip -X -j build/dist/pitstop-x64.zip build/windows-amd64/pitstop.exe
          zip -X -j build/dist/pitstop-x86.zip build/windows-386/pitstop.exe
          zip -X -j build/dist/pitstop-arm64.zip build/windows-arm64/pitstop.exe
          find build/windows-* -type f ! -name pitstop.exe ! -name .mygo-files -exec cp -t build/dist {} +
          cd build/dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        with:
          name: release-files-${{ steps.version.outputs.version }}
          path: |
            build/dist/*
            build/source-tree
          if-no-files-found: error
          overwrite: true

  create_pr:
    needs: [lint, test, build]
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-files-${{ inputs.version }}
          path: release-build
      - name: Create version pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch=release
          git config user.name 'Bush2021'
          git config user.email '79072750+Bush2021@users.noreply.github.com'
          git switch -c "$branch"
          jq --arg version "$VERSION" '.version = $version' mygo.json > mygo.json.tmp
          mv mygo.json.tmp mygo.json
          git add mygo.json
          test "$(git write-tree)" = "$(cat release-build/source-tree)"
          git commit -m "Update version to $VERSION" -m "Build-Run-Id: $GITHUB_RUN_ID"
          git push --force origin "HEAD:refs/heads/$branch"
          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --repo "$GITHUB_REPOSITORY" \
              --title "Update version to $VERSION" --body "Build-Run-Id: $GITHUB_RUN_ID"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Update version to $VERSION" --body "Build-Run-Id: $GITHUB_RUN_ID"
          fi
